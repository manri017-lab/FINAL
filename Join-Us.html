<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Join Us</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<section class="container">

    <header>
        <img src="images/logo.png" alt="Soda Stereo" width="110" height="110">
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="Albums.html">Albums</a>
        <a href="#" class="current-page">Join Us</a>
    </nav>

    <section class="content">
        <div class="title">
            <h1>Stay Updated on News and Events!</h1>
            <img src="images/impact.png" alt="Join Us" width="100%" height="100%">
        </div>

        <form>
            <div class="columns">
                <div>
                    <div class="inputBlock">
                        <label for="firstName">First Name</label>
                        <input type="text" id="firstName" name="firstName">
                    </div>

                    <div class="inputBlock">
                        <label for="emailAddress">Email Address</label>
                        <input type="text" id="emailAddress" name="emailAddress">
                    </div>

                    <div class="inputBlock">
                        <label for="contactMethod">Contact Method</label>
                        <select name="contactMethod" id="contactMethod" multiple>
                            <option value="email">Email</option>
                            <option value="phone">Phone</option>
                        </select>
                    </div>
                </div>

                <div>
                    <div class="inputBlock">
                        <label for="lastName">Last Name</label>
                        <input type="text" id="lastName" name="lastName">
                    </div>

                    <div class="inputBlock">
                        <label for="phoneNumber">Phone Number</label>
                        <input type="text" id="phoneNumber" name="phoneNumber">
                    </div>

                    <div class="inputBlock">
                        Sign Me Up For...
                        <div class="checkboxes">
                            <div class="checkbox">
                                <input type="checkbox" name="signMeUpFor" value="Newsletter">
                                Newsletter
                            </div>
                            <div class="checkbox">
                                <input type="checkbox" name="signMeUpFor" value="Mailing Lists">
                                Mailing List
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="submit-button">
                <input type="button" value="Submit">
            </div>
        </form>

    </section>

    <footer>
        <img src="images/logo-2.png" alt="Soda Stereo" height="100">
    </footer>

</section>

</body>
</html>
